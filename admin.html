<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Bulevar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">

    <header class="bg-gray-900 text-white py-6 px-6 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">⚙️ Panel de Administración del Bulevar</h1>
            <p class="text-xs text-gray-400 mt-0.5">Sube el logo de tu local desde el PC y gestiona menús.</p>
        </div>
        <div class="flex gap-3">
            <button onclick="restaurarDatosOriginales()" class="bg-red-700 hover:bg-red-800 text-white px-3 py-2 rounded-xl text-xs font-medium transition">
                Restaurar Fábrica
            </button>
            <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-xl text-sm font-medium transition">
                Ver Vitrina Pública ↗
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 my-6 space-y-6">
        
        <!-- Formulario para agregar un nuevo local con Logo desde PC -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-2">➕ Agregar Nuevo Local</h2>
            <p class="text-xs text-gray-500 mb-4">Ingresa los datos y selecciona el logo desde tu computador.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="nuevo-id" placeholder="ID único sin espacios (ej. micasa)" class="border border-gray-300 p-2.5 rounded-xl text-sm">
                <input type="text" id="nuevo-nombre" placeholder="Nombre del Local (ej. Comidas Mi Casa)" class="border border-gray-300 p-2.5 rounded-xl text-sm">
                <input type="text" id="nuevo-categoria" placeholder="Categoría (ej. Comida Típica)" class="border border-gray-300 p-2.5 rounded-xl text-sm">
                <input type="text" id="nuevo-whatsapp" placeholder="WhatsApp (ej. 573001112233)" class="border border-gray-300 p-2.5 rounded-xl text-sm">
                
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Logo del Local desde el PC:</label>
                    <input type="file" id="nuevo-logo-file" accept="image/*" class="border border-gray-300 p-2 rounded-xl text-sm w-full bg-gray-50">
                </div>
            </div>
            <button onclick="procesarCrearLocal()" class="mt-4 bg-amber-600 hover:bg-amber-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition">
                Registrar Local
            </button>
        </div>

        <!-- Listado de gestión de Locales -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Restaurantes Registrados (<span id="total-locales">0</span>)</h2>
            <div id="admin-lista-locales" class="space-y-6">
                <!-- Se llena con JS -->
            </div>
        </div>

    </main>

    <script src="data.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            renderizarAdmin();
        });

        function renderizarAdmin() {
            const contenedor = document.getElementById("admin-lista-locales");
            const totalLocales = document.getElementById("total-locales");
            contenedor.innerHTML = "";

            const baseDeDatos = JSON.parse(localStorage.getItem("bulevarRestaurantes")) || bulevarData;
            const llaves = Object.keys(baseDeDatos);
            totalLocales.innerText = llaves.length;

            llaves.forEach(key => {
                let local = baseDeDatos[key];
                
                let listaPlatosHTML = "";
                if (local.menu && local.menu.length > 0) {
                    local.menu.forEach( (plato, index) => {
                        listaPlatosHTML += `<li class="text-xs text-gray-600 flex justify-between items-center border-b border-gray-100 py-2 gap-2">
                            <div class="flex items-center gap-2">
                                <img src="${plato.imagen}" class="w-10 h-10 object-cover rounded-lg border">
                                <div>
                                    <strong>${plato.nombre}</strong> - $${plato.precio.toLocaleString()}
                                    <p class="text-gray-400">${plato.desc || ''}</p>
                                </div>
                            </div>
                            <button onclick="eliminarPlato('${local.id}', ${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 text-xs">✕</button>
                        </li>`;
                    });
                } else {
                    listaPlatosHTML = `<li class="text-xs text-gray-400 italic">No hay platos registrados aún.</li>`;
                }

                let logoVisual = local.logo 
                    ? `<img src="${local.logo}" class="w-full h-full object-cover rounded-xl">` 
                    : '🍽️';

                contenedor.innerHTML += `
                    <div class="border border-gray-200 rounded-xl p-5 bg-gray-50 space-y-4">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div class="flex items-center gap-3">
                                <div class="bg-white border w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-sm overflow-hidden">
                                    ${logoVisual}
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-900">${local.nombre}</h3>
                                    <p class="text-xs text-gray-500">Categoría: ${local.categoria} | WhatsApp: ${local.whatsapp}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <a href="restaurante.html?local=${local.id}" target="_blank" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                    Ver Carta ↗
                                </a>
                                <button onclick="eliminarLocal('${local.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                    Eliminar Local
                                </button>
                            </div>
                        </div>

                        <!-- Sección de Platos -->
                        <div class="bg-white p-3 rounded-lg border border-gray-200 space-y-2">
                            <p class="text-xs font-bold text-gray-700 uppercase tracking-wider">Menú (${local.menu ? local.menu.length : 0}):</p>
                            <ul class="space-y-1 max-h-48 overflow-y-auto">
                                ${listaPlatosHTML}
                            </ul>

                            <!-- Formulario para agregar plato rápido con imagen predeterminada automática -->
                            <div class="mt-3 pt-3 border-t border-gray-100 grid grid-cols-1 md:grid-cols-3 gap-2">
                                <input type="text" id="plato-nombre-${local.id}" placeholder="Nombre del plato" class="border border-gray-200 p-2 rounded-lg text-xs">
                                <input type="number" id="plato-precio-${local.id}" placeholder="Precio (ej. 25000)" class="border border-gray-200 p-2 rounded-lg text-xs">
                                <div class="flex gap-2">
                                    <input type="text" id="plato-desc-${local.id}" placeholder="Descripción breve" class="border border-gray-200 p-2 rounded-lg text-xs flex-1">
                                    <button onclick="agregarPlatoPredeterminado('${local.id}')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">
                                        + Plato
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function procesarCrearLocal() {
            const id = document.getElementById("nuevo-id").value.trim().toLowerCase().replace(/\s+/g, '');
            const nombre = document.getElementById("nuevo-nombre").value.trim();
            const categoria = document.getElementById("nuevo-categoria").value.trim();
            const whatsapp = document.getElementById("nuevo-whatsapp").value.trim();
            const inputArchivo = document.getElementById("nuevo-logo-file");

            if (!id || !nombre || !whatsapp) {
                alert("Por favor completa al menos el ID, el Nombre y el WhatsApp.");
                return;
            }

            let baseDeDatos = JSON.parse(localStorage.getItem("bulevarRestaurantes")) || bulevarData;

            if (inputArchivo.files && inputArchivo.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    guardarNuevoLocalEnBD(baseDeDatos, id, nombre, categoria, whatsapp, e.target.result);
                };
                reader.readAsDataURL(inputArchivo.files[0]);
            } else {
                guardarNuevoLocalEnBD(baseDeDatos, id, nombre, categoria, whatsapp, "");
            }
        }

        function guardarNuevoLocalEnBD(db, id, nombre, categoria, whatsapp, logoBase64) {
            db[id] = {
                id: id,
                nombre: nombre,
                categoria: categoria || "Gastronomía",
                logo: logoBase64,
                whatsapp: whatsapp,
                redes: { instagram: "@bulevar" },
                menu: []
            };
            localStorage.setItem("bulevarRestaurantes", JSON.stringify(db));
            alert("¡Local creado con éxito!");
            location.reload();
        }

        function agregarPlatoPredeterminado(localId) {
            const nombre = document.getElementById(`plato-nombre-${localId}`).value.trim();
            const precio = parseFloat(document.getElementById(`plato-precio-${localId}`).value);
            const desc = document.getElementById(`plato-desc-${localId}`).value.trim();

            if (!nombre || isNaN(precio)) {
                alert("Por favor ingresa al menos el nombre y el precio.");
                return;
            }

            let baseDeDatos = JSON.parse(localStorage.getItem("bulevarRestaurantes")) || bulevarData;
            if (!baseDeDatos[localId].menu) baseDeDatos[localId].menu = [];

            // Lista de fotos de referencia predeterminadas y profesionales de comida de alta calidad
            const fotosPredeterminadas = [
                "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500",
                "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500",
                "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500",
                "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500"
            ];
            // Asigna una foto de forma rotativa o aleatoria automática
            const fotoAleatoria = fotosPredeterminadas[Math.floor(Math.random() * fotosPredeterminadas.length)];

            baseDeDatos[localId].menu.push({
                id: Date.now(),
                nombre: nombre,
                precio: precio,
                desc: desc || "Delicioso plato recomendado del bulevar.",
                imagen: fotoAleatoria
            });

            localStorage.setItem("bulevarRestaurantes", JSON.stringify(baseDeDatos));
            alert("¡Plato añadido con su foto de referencia automática!");
            renderizarAdmin();
        }

        function eliminarLocal(localId) {
            let baseDeDatos = JSON.parse(localStorage.getItem("bulevarRestaurantes")) || bulevarData;
            if (confirm(`¿Seguro que deseas eliminar el local?`)) {
                delete baseDeDatos[localId];
                localStorage.setItem("bulevarRestaurantes", JSON.stringify(baseDeDatos));
                renderizarAdmin();
            }
        }

        function eliminarPlato(localId, index) {
            let baseDeDatos = JSON.parse(localStorage.getItem("bulevarRestaurantes")) || bulevarData;
            baseDeDatos[localId].menu.splice(index, 1);
            localStorage.setItem("bulevarRestaurantes", JSON.stringify(baseDeDatos));
            renderizarAdmin();
        }

        function restaurarDatosOriginales() {
            if (confirm("¿Restablecer datos de fábrica?")) {
                localStorage.removeItem("bulevarRestaurantes");
                location.reload();
            }
        }
    </script>
</body>
</html>
