<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Restaurante - Bulevar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- Barra Superior -->
    <header class="bg-white shadow-sm py-4 px-4 sticky top-0 z-10 flex justify-between items-center">
        <a href="index.html" class="text-amber-600 font-medium text-sm">← Volver al Bulevar</a>
        <h1 id="titulo-restaurante" class="font-bold text-lg text-gray-800">Restaurante</h1>
        <span id="badge-mesa" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold">Mesa: #--</span>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <!-- Contenedor del Menú con Fotos -->
        <div id="menu-container" class="space-y-4">
            <!-- Los platos se cargan dinámicamente -->
        </div>
    </main>

    <!-- Barra Inferior del Carrito -->
    <div id="carrito-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg hidden">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Total a Pagar</p>
                <p id="total-precio" class="text-xl font-bold text-gray-900">$0</p>
            </div>
            <button onclick="abrirModalCliente()" class="bg-green-600 hover:bg-green-700 text-white font-medium px-6 py-2.5 rounded-xl shadow flex items-center gap-2 transition">
                📲 Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <!-- Modal de Datos del Cliente -->
    <div id="modal-cliente" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-gray-800">📋 Finalizar tu Pedido</h3>
            <p class="text-sm text-gray-500">Por favor indícanos tus datos para enviarle el pedido al restaurante.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Tu Nombre o Apodo:</label>
                    <input type="text" id="cliente-nombre" placeholder="Ej. Carlos Pérez" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Notas especiales (Opcional):</label>
                    <textarea id="cliente-notas" placeholder="Ej. Sin cebolla, término medio, etc." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" rows="2"></textarea>
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="cerrarModalCliente()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium text-sm transition">
                    Cancelar
                </button>
                <button onclick="confirmarYEnviarWhatsApp()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-medium text-sm transition">
                    Enviar a WhatsApp 📲
                </button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        let carrito = [];
        let localActual = null;
        let numeroMesa = "1";

        window.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const tipoLocal = params.get("local");
            numeroMesa = params.get("mesa") || "General";

            const baseDeDatos = JSON.parse(localStorage.getItem("bulevarRestaurantes")) || bulevarData;
            localActual = baseDeDatos[tipoLocal];

            if (localActual) {
                document.getElementById("titulo-restaurante").innerText = localActual.nombre;
                document.getElementById("badge-mesa").innerText = `Mesa: #${numeroMesa}`;
                renderizarMenu();
            } else {
                document.getElementById("menu-container").innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center text-sm">
                        ⚠️ No se encontró información para este restaurante.
                    </div>
                `;
            }
        });

        function renderizarMenu() {
            const container = document.getElementById("menu-container");
            container.innerHTML = "";

            if (!localActual.menu || localActual.menu.length === 0) {
                container.innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl text-center text-sm">
                        🍽️ Este restaurante aún no ha agregado platos a su carta.
                    </div>
                `;
                return;
            }

            localActual.menu.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <img src="${item.imagen || 'https://via.placeholder.com/100'}" class="w-20 h-20 object-cover rounded-xl border shrink-0" onerror="this.src='https://via.placeholder.com/100'">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800">${item.nombre}</h3>
                            <p class="text-xs text-gray-500 my-1">${item.desc || ''}</p>
                            <p class="text-amber-600 font-semibold">$${item.precio.toLocaleString()}</p>
                        </div>
                        <button onclick="agregarAlCarrito(${item.id})" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-3 py-2 rounded-xl transition text-sm">
                            +
                        </button>
                    </div>
                `;
            });
        }

        function agregarAlCarrito(id) {
            const plato = localActual.menu.find(p => p.id === id);
            const itemCarrito = carrito.find(p => p.id === id);

            if (itemCarrito) {
                itemCarrito.cantidad += 1;
            } else {
                carrito.push({ ...plato, cantidad: 1 });
            }

            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const barra = document.getElementById("carrito-bar");
            const totalElemento = document.getElementById("total-precio");

            if (carrito.length > 0) {
                barra.classList.remove("hidden");
                const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
                totalElemento.innerText = `$${total.toLocaleString()}`;
            } else {
                barra.classList.add("hidden");
            }
        }

        function abrirModalCliente() {
            if (carrito.length === 0) return;
            document.getElementById("modal-cliente").classList.remove("hidden");
        }

        function cerrarModalCliente() {
            document.getElementById("modal-cliente").classList.add("hidden");
        }

        function confirmarYEnviarWhatsApp() {
            const nombreCliente = document.getElementById("cliente-nombre").value.trim();
            const notasCliente = document.getElementById("cliente-notas").value.trim();

            if (!nombreCliente) {
                alert("Por favor ingresa tu nombre para identificar el pedido en la mesa.");
                return;
            }

            let mensaje = `🛎️ *NUEVO PEDIDO - MESA #${numeroMesa}* \n`;
            mensaje += `📍 *Restaurante:* ${localActual.nombre}\n`;
            mensaje += `👤 *Cliente:* ${nombreCliente}\n\n`;
            mensaje += `*Detalle del pedido:*\n`;

            let total = 0;
            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `• ${item.cantidad}x ${item.nombre} - $${subtotal.toLocaleString()}\n`;
            });

            if (notasCliente) {
                mensaje += `\n📝 *Notas:* "${notasCliente}"\n`;
            }

            mensaje += `\n💰 *TOTAL ESTIMADO: $${total.toLocaleString()}*`;
            mensaje += `\n\n_Pedido generado desde el Bulevar Gastronómico._`;

            const urlWhatsApp = `https://wa.me/${localActual.whatsapp}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, "_blank");

            cerrarModalCliente();
        }
    </script>
</body>
</html>
